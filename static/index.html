<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gmail MCP Assistant</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1f2430;--muted:#6b7280;--accent:#2563eb;--border:#e5e7eb;--err:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--fg:#e6e8ee;--muted:#9aa3b2;--accent:#60a5fa;--border:#262b36;--err:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:820px;height:100vh;display:flex;flex-direction:column;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
h1{font-size:18px;margin:0}
#log{flex:1;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{padding:8px 12px;border-radius:12px;max-width:85%;white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;background:var(--accent);color:#fff}
.bot{align-self:flex-start;background:var(--bg);border:1px solid var(--border)}
.err{align-self:flex-start;color:var(--err);border:1px solid var(--err)}
.trace{align-self:flex-start;font:12px ui-monospace,monospace;color:var(--muted);white-space:pre-wrap}
.confirm{align-self:flex-start;border:2px solid var(--accent);border-radius:12px;padding:10px 12px;max-width:90%}
.confirm pre{margin:6px 0;white-space:pre-wrap;font:13px ui-monospace,monospace}
button{font:inherit;border:1px solid var(--border);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.row{display:flex;gap:8px}
textarea{flex:1;resize:none;font:inherit;border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--card);color:var(--fg)}
</style></head><body><main>
<header><h1>📧 Gmail MCP Assistant</h1><button id="reset">New chat</button></header>
<div id="log"></div>
<div class="chips" id="chips"></div>
<div class="row"><textarea id="msg" rows="2" placeholder="e.g. Show unread emails from the last 3 days"></textarea>
<button class="primary" id="go">Send</button></div>
<script>
const log=document.getElementById('log'),box=document.getElementById('msg'),go=document.getElementById('go');
const chips=["Search emails about invoice","Show my unread emails from the last 7 days","Show emails with attachments from last month","Summarize my latest email","Send an email to me@example.com with subject 'MCP test' saying hello"];
chips.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{box.value=t;box.focus()};document.getElementById('chips').appendChild(b)});
function add(cls,text){const d=document.createElement('div');d.className='m '+cls;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight}
function busy(b){go.disabled=b;box.disabled=b}
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});return r.json()}
function handle(res){
  if(res.trace&&res.trace.length){const t=document.createElement('div');t.className='trace';t.textContent=res.trace.map(x=>'🔧 '+x.tool+' '+JSON.stringify(x.args)).join('\n');log.appendChild(t)}
  if(res.type==='confirm')showConfirm(res);
  else add(res.type==='error'?'err':'bot',res.text||'(empty)');
  busy(false);log.scrollTop=log.scrollHeight}
function showConfirm(res){
  const d=document.createElement('div');d.className='confirm';
  const h=document.createElement('b');h.textContent='Approve this action? → '+res.tool;
  const p=document.createElement('pre');p.textContent=JSON.stringify(res.args,null,2);
  const ok=document.createElement('button');ok.className='primary';ok.textContent='Approve';
  const no=document.createElement('button');no.textContent='Reject';
  const decide=async a=>{ok.disabled=no.disabled=true;busy(true);handle(await post('/api/confirm',{approve:a}))};
  ok.onclick=()=>decide(true);no.onclick=()=>decide(false);
  d.append(h,p,ok,' ',no);log.appendChild(d)}
async function send(){const t=box.value.trim();if(!t)return;box.value='';add('user',t);busy(true);
  try{handle(await post('/api/chat',{message:t}))}catch(e){add('err',String(e));busy(false)}}
go.onclick=send;box.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
document.getElementById('reset').onclick=async()=>{await post('/api/reset');log.innerHTML=''};
</script></main></body></html>
